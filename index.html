:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#1F1B18; --soft:#6E6660; --line:#ECE4DB;
  --a:#D6336C; --a-ink:#C2255C; --on-a:#FFFFFF; --a-soft:#FCE4EE; --ok:#2FA36B; --ok-soft:#DFF4E9; --water:#2F80ED; --water-soft:#E3EEFD;
  --sport:#7B5CFA; --sport-soft:#ECE7FF; --yellow:#FFB020;
  --r:18px; --shadow:0 2px 10px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0C0B; --card:#1F1C1A; --ink:#FAF6F2; --soft:#CFC6BE; --line:#433C37;
    --a:#FF7AAC; --a-ink:#FF8FBB; --on-a:#2B0716; --a-soft:#47202F; --ok:#3CC783; --ok-soft:#1A3A2B; --water:#5FA2FF; --water-soft:#1B2D48; --sport:#A48BFF; --sport-soft:#2D2550; --shadow:0 1px 0 rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0C0B; --card:#1F1C1A; --ink:#FAF6F2; --soft:#CFC6BE; --line:#433C37;
    --a:#FF7AAC; --a-ink:#FF8FBB; --on-a:#2B0716; --a-soft:#47202F; --ok:#3CC783; --ok-soft:#1A3A2B; --water:#5FA2FF; --water-soft:#1B2D48; --sport:#A48BFF; --sport-soft:#2D2550; --shadow:0 1px 0 rgba(255,255,255,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","InterApp",system-ui,sans-serif;font-feature-settings:"tnum" 0;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hd small{display:block;font-size:13px;color:var(--soft);font-weight:600;text-transform:capitalize}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.daynav{display:flex;align-items:center;gap:8px;margin-top:12px}
.daynav button{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:700}
.daynav .lbl{flex:1;text-align:center;font-weight:700;font-size:15px;text-transform:capitalize}
.daynav .today-btn{width:auto;padding:0 12px;font-size:13px}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-top:14px}
.card h2{font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card h2 .tag{font-size:12px;font-weight:700;color:var(--soft)}
.muted{color:var(--soft);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

/* summary ring */
.summary{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-size:24px;font-weight:800;display:block;line-height:1}
.ring span{font-size:12px;color:var(--soft);font-weight:600}
.stats{display:grid;gap:8px}
.stat{display:flex;align-items:center;gap:10px;font-size:14px}
.stat i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:16px;flex:none}
.stat b{font-weight:800}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.sport-box{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--sport-soft)}
.sport-box .em{font-size:26px}
.sport-box b{display:block;font-size:16px}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* meals */
.meal{border-top:1px solid var(--line);padding:10px 0}
.meal:first-of-type{border-top:none;padding-top:0}
.meal-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal-hd b{font-size:14px}
.meal-hd span{font-size:13px;color:var(--soft);font-weight:700}
.plan-txt{font-size:13px;color:var(--soft);margin-top:2px}
.item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.item .k{color:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.del{width:28px;height:28px;border-radius:9px;color:var(--soft);font-size:18px;line-height:1;flex:none}
.del:active{background:var(--a-soft);color:var(--a-ink)}
.add-link{font-size:14px;font-weight:700;color:var(--a-ink);padding:6px 0}

/* water */
.water{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.glass{width:30px;height:38px;border-radius:4px 4px 10px 10px;border:2px solid var(--water);position:relative;overflow:hidden;background:var(--card)}
.glass.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:var(--water);opacity:.85}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:800}
.btn{height:46px;padding:0 18px;border-radius:14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-a{background:var(--a);color:var(--on-a)}
.btn-soft{background:var(--a-soft);color:var(--a-ink)}
.btn-water{background:var(--water-soft);color:var(--water)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-block{width:100%}

/* inputs */
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--soft)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
textarea{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700;background:var(--bg)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* week */
.week-day{padding:12px 0;border-top:1px solid var(--line)}
.week-day:first-child{border-top:none;padding-top:0}
.week-day .wd-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.week-day .wd-hd b{font-size:16px;text-transform:capitalize}
.week-day .wd-hd.today b::after{content:" · hoy";color:var(--a-ink);font-size:13px}
.wd-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.wd-grid span:nth-child(odd){color:var(--soft);font-weight:700;font-size:13px}
.wd-grid em{font-style:normal;color:var(--soft)}

/* shopping */
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.shop-item:first-child{border-top:none}
.shop-item .nm{flex:1;font-size:16px}
.shop-item.done .nm{text-decoration:line-through;color:var(--soft)}
.cat-title{font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}

/* progress */
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:800}
.kpi span{font-size:12px;color:var(--soft);font-weight:600}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:700;color:var(--soft);border-radius:12px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--a-ink)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--a);color:var(--on-a);font-size:11px;display:grid;place-items:center;padding:0 5px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}
.est{font-size:13px;color:var(--soft);margin:-4px 0 12px;line-height:1.45}
.est b{color:var(--ink)}
.est button{color:var(--a-ink);font-weight:700;font-size:13px;margin-left:4px}
.empty{text-align:center;padding:18px 0;color:var(--soft);font-size:14px}
.view[hidden],nav.tabs .badge[hidden]{display:none}
.mt{margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div><small id="hdSub"></small><h1 id="hdTitle">Hoy</h1></div>
      <button class="icon-btn" id="btnSettings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </div>
    <div class="daynav" id="dayNav">
      <button id="prevDay" aria-label="Día anterior">‹</button>
      <div class="lbl" id="dayLbl"></div>
      <button id="nextDay" aria-label="Día siguiente">›</button>
      <button class="today-btn" id="goToday">Hoy</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- HOY -->
  <section class="view" id="v-hoy"></section>
  <!-- SEMANA -->
  <section class="view" id="v-semana" hidden></section>
  <!-- COMPRA -->
  <section class="view" id="v-compra" hidden></section>
  <!-- PROGRESO -->
  <section class="view" id="v-progreso" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
    <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Semana</button>
    <button data-tab="compra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Compra<span class="badge" id="shopBadge" hidden></span></button>
    <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  /* ================= datos ================= */
  var KEY = "miplan-v1";
  var MEALS = [["desayuno", "Desayuno", "🥣"], ["comida", "Comida", "🍽️"], ["merienda", "Merienda", "🍎"], ["cena", "Cena", "🌙"], ["snack", "Picoteo", "🍫"]];
  var WD = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];
  var CATS = ["Fruta y verdura", "Carne y pescado", "Lácteos y huevos", "Panadería", "Despensa", "Congelados", "Bebidas", "Limpieza e higiene", "Otros"];
  var SPORT_EMOJI = function (s) {
    s = (s || "").toLowerCase();
    if (!s) return "😌";
    if (/descanso|nada|libre/.test(s)) return "😌";
    if (/correr|run|carrera/.test(s)) return "🏃‍♀️";
    if (/yoga|pilates|estir/.test(s)) return "🧘‍♀️";
    if (/nada|piscina|swim/.test(s)) return "🏊‍♀️";
    if (/bici|spinning|ciclo/.test(s)) return "🚴‍♀️";
    if (/andar|caminar|paseo/.test(s)) return "🚶‍♀️";
    if (/baile|zumba/.test(s)) return "💃";
    return "🏋️‍♀️";
  };
  function blankPlan() { var p = {}; for (var i = 0; i < 7; i++) p[i] = { sport: "", meals: { desayuno: "", comida: "", merienda: "", cena: "" } }; return p; }
  var S = {
    settings: { kcalGoal: "", waterGoal: 8, glassMl: 250, theme: "auto" },
    plan: blankPlan(),
    days: {},
    shopping: [],
    foodsMemo: {},
    exMemo: {}
  };
  try { var raw = localStorage.getItem(KEY); if (raw) { var d = JSON.parse(raw); S = Object.assign(S, d); S.settings = Object.assign({ kcalGoal: "", waterGoal: 8, glassMl: 250, theme: "auto" }, d.settings || {}); if (!S.plan || !S.plan[0]) S.plan = blankPlan(); } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("No se pudo guardar en este navegador"); } }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function iso(d) { var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function wdIndex(d) { return (d.getDay() + 6) % 7; }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function today() { return iso(new Date()); }
  function day(s) { if (!S.days[s]) S.days[s] = { foods: [], water: 0, exercises: [], weight: "", sportDone: false, note: "" }; return S.days[s]; }
  function kcalOf(dd) { return (dd.foods || []).reduce(function (a, f) { return a + (+f.kcal || 0); }, 0); }
  function burnOf(dd) { return (dd.exercises || []).reduce(function (a, f) { return a + (+f.kcal || 0); }, 0); }
  function fmt(n) { return Math.round(n).toLocaleString("es-ES"); }
  function nice(s, opt) { return parse(s).toLocaleDateString("es-ES", opt || { weekday: "long", day: "numeric", month: "long" }); }


  /* ===== calorías aproximadas (raciones típicas) ===== */
  var FOOD_RAW = "manzana:80:0|platano:105:0|naranja:65:0|mandarina:40:0|pera:85:0|fresas:45:0|fresa:45:0|uvas:100:0|kiwi:45:0|melon:60:0|sandia:60:0|piña:60:0|melocoton:55:0|mango:120:0|arandanos:45:0|frutos rojos:45:0|cerezas:60:0|higos:75:0|aguacate:160:0|medio aguacate:120:0|fruta:70:0|macedonia:90:0|zumo de naranja:90:6|zumo:100:6|tomate:20:0|lechuga:10:0|ensalada:60:0|ensalada mixta:150:0|brocoli:35:0|coliflor:30:0|espinacas:25:0|zanahoria:25:0|pepino:15:0|pimiento:25:0|cebolla:40:0|calabacin:30:0|berenjena:35:0|champiñones:25:0|setas:30:0|judias verdes:35:0|esparragos:25:0|alcachofas:50:0|guisantes:80:0|maiz:90:4|patata:130:0|patatas:130:0|patata cocida:130:0|boniato:115:0|verduras:60:0|verdura:60:0|pure de patatas:180:0|crema de calabacin:120:0|crema de verduras:130:0|crema de calabaza:120:0|gazpacho:110:4|salmorejo:200:4|pisto:150:0|menestra:120:5|pollo:200:1|pechuga de pollo:180:1|pechuga:180:1|muslo de pollo:220:1|pavo:150:1|fiambre de pavo:50:1|jamon york:60:1|jamon serrano:90:1|jamon:90:1|lomo:220:1|cerdo:250:1|filete:220:1|ternera:230:1|hamburguesa:280:1|albondigas:300:1|carne picada:280:1|chorizo:150:1|salchichas:250:1|bacon:160:1|cordero:300:1|conejo:180:1|salmon:250:1|merluza:110:1|bacalao:110:1|atun:120:4|atun en lata:120:4|lata de atun:120:4|sardinas:180:4|gambas:90:5|langostinos:90:5|calamares:150:1|calamares a la romana:330:5|pulpo:130:1|mejillones:90:1|dorada:180:1|lubina:170:1|pescado:150:1|surimi:70:1|boquerones:180:1|huevo:75:2|huevos:75:2|tortilla francesa:180:2:90|tortilla de patatas:330:2|tortilla:250:2|revuelto:200:2:100|huevos revueltos:200:2:100|huevo frito:110:2|huevo cocido:75:2|leche:120:2|vaso de leche:120:2|leche desnatada:85:2|leche de avena:100:2|bebida de avena:100:2|leche de almendras:40:2|yogur:80:2|yogur griego:140:2|yogur natural:65:2|yogur proteico:90:2|kefir:110:2|queso:120:2|queso fresco:70:2|queso batido:70:2|mozzarella:150:2|requeson:80:2|nata:200:2|mantequilla:75:4|pan:160:3|tostada:90:3|tostadas:90:3|bocadillo:400:3|sandwich:300:3|pan integral:150:3|pan de molde:140:3|biscotes:80:3|tortitas de arroz:35:4|tortitas de maiz:30:4|croissant:230:3|magdalena:180:3|bolleria:350:3|galletas:150:4|cereales:150:4|avena:150:4|copos de avena:150:4|granola:200:4|muesli:180:4|tortitas:250:4|crepes:200:4|pizza:800:5|pizza casera:700:3|empanada:350:3|wrap:250:3|fajitas:450:3|burrito:550:3|tacos:400:3|arroz:260:4|arroz blanco:260:4|arroz integral:250:4|paella:550:4|arroz con pollo:550:4|risotto:500:4|pasta:350:4|macarrones:350:4|espaguetis:350:4|espagueti:350:4|lasaña:500:5|fideos:300:4|cuscus:250:4|quinoa:220:4|lentejas:350:4|garbanzos:300:4|alubias:300:4|judias:300:4|cocido:650:4|fabada:600:4|sopa:150:4|caldo:40:4|sopa de fideos:200:4|legumbres:300:4|hummus:100:4|tofu:120:8|aceite:90:4|aceite de oliva:90:4|mayonesa:100:4|ketchup:20:4|tomate frito:40:4|salsa:60:4|frutos secos:180:4|nueces:180:4|almendras:170:4|cacahuetes:170:4|pistachos:160:4|crema de cacahuete:190:4|mermelada:40:4|miel:60:4|azucar:20:4|chocolate:150:4|onza de chocolate:55:4|cacao:40:4|nocilla:200:4|nutella:200:4|aceitunas:50:4|patatas fritas:400:5|patatas de bolsa:270:4|palomitas:180:4|helado:200:5|tarta:400:8|bizcocho:300:3|donut:250:3|natillas:150:2|flan:130:2|gelatina:20:2|barrita:200:4|barrita de proteinas:200:4|batido de proteinas:130:4|proteina:120:4|whey:120:4|cafe:5:6|cafe con leche:70:6|cortado:30:6|capuchino:110:6|te:2:6|infusion:2:6|cola cao:150:6|colacao:150:6|refresco:140:6|coca cola:140:6|coca cola zero:1:6|cerveza:150:6|cerveza sin alcohol:70:6|vino:120:6|copa de vino:120:6|zumo natural:110:6|batido:250:6|smoothie:200:6|bebida energetica:110:6|agua:0:6|croquetas:300:5|nuggets:300:5|san jacobo:350:5|kebab:700:8|hamburguesa completa:700:8|patatas bravas:450:8|sushi:400:8|poke:550:8|ramen:600:8|sandwich mixto:330:3|perrito:300:3|menu del dia:900:8|cena fuera:800:8|comida fuera:900:8|ensaladilla:300:5|ensalada cesar:450:0";
  var FOOD = FOOD_RAW.split("|").map(function (x) { var p = x.split(":"); return { k: p[0], kcal: +p[1], cat: +p[2], unit: +p[3] || 0 }; });
  function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ñ/g, "n"); }
  FOOD.forEach(function (f) { f.n = norm(f.k); f.re = new RegExp("(^|[^a-z])((\\d+(?:[.,]\\d+)?|un|una|dos|tres|cuatro|medio|media)\\s+)?(" + f.n.replace(/ /g, "\\s+") + ")(s|es)?(?![a-z])"); });
  FOOD.sort(function (a, b) { return b.n.length - a.n.length; });
  var NUM = { un: 1, una: 1, dos: 2, tres: 3, cuatro: 4, medio: .5, media: .5 };
  function estimate(txt) {
    var o = " " + (txt || "").toLowerCase() + " ", t = " " + norm(txt) + " ", parts = [], total = 0;
    FOOD.forEach(function (f) {
      var m = t.match(f.re); if (!m) return;
      var q = 1; if (m[3]) q = NUM[m[3]] || parseFloat(m[3].replace(",", ".")) || 1;
      if (q > 20) q = 1;
      var k = Math.round(m[3] && f.unit ? f.unit * q : f.kcal * q); total += k;
      var st = m.index + m[1].length + (m[2] ? m[2].length : 0), ln = m[4].length + (m[5] ? m[5].length : 0);
      parts.push({ name: o.substr(st, ln), q: f.unit ? 1 : q, kcal: k });
      t = t.slice(0, m.index) + t.slice(m.index, m.index + m[0].length).replace(/[^ ]/g, "#") + t.slice(m.index + m[0].length);
    });
    return parts.length ? { total: total, parts: parts } : null;
  }
  function catOf(txt) { var t = " " + norm(txt) + " "; for (var i = 0; i < FOOD.length; i++) if (FOOD[i].re.test(t)) return CATS[FOOD[i].cat] || "Otros"; return "Otros"; }

  if (S.settings.theme !== "auto") document.documentElement.setAttribute("data-theme", S.settings.theme);

  var cur = today(), tab = "hoy";
  var $ = function (id) { return document.getElementById(id); };

  /* ================= navegación ================= */
  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); render(); window.scrollTo(0, 0); });
  });
  $("prevDay").onclick = function () { cur = addDays(cur, tab === "semana" ? -7 : -1); render(); };
  $("nextDay").onclick = function () { cur = addDays(cur, tab === "semana" ? 7 : 1); render(); };
  $("goToday").onclick = function () { cur = today(); render(); };
  $("btnSettings").onclick = openSettings;

  function render() {
    document.querySelectorAll("nav.tabs button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === tab); });
    ["hoy", "semana", "compra", "progreso"].forEach(function (t) { $("v-" + t).hidden = t !== tab; });
    $("dayNav").style.display = (tab === "hoy" || tab === "semana") ? "flex" : "none";
    var titles = { hoy: cur === today() ? "Hoy" : "Día", semana: "Semana", compra: "Lista de la compra", progreso: "Progreso" };
    $("hdTitle").textContent = titles[tab];
    $("hdSub").textContent = nice(today(), { weekday: "long", day: "numeric", month: "short" });
    if (tab === "hoy") { $("dayLbl").textContent = cur === today() ? "Hoy · " + nice(cur, { day: "numeric", month: "short" }) : nice(cur); renderHoy(); }
    if (tab === "semana") { var m = monday(cur); $("dayLbl").textContent = nice(m, { day: "numeric", month: "short" }) + " – " + nice(addDays(m, 6), { day: "numeric", month: "short" }); renderSemana(); }
    if (tab === "compra") renderCompra();
    if (tab === "progreso") renderProgreso();
    var left = S.shopping.filter(function (i) { return !i.done; }).length;
    $("shopBadge").hidden = !left; $("shopBadge").textContent = left;
  }
  function monday(s) { var d = parse(s); return addDays(s, -wdIndex(d)); }

  /* ================= HOY ================= */
  function renderHoy() {
    var dd = day(cur), d = parse(cur), plan = S.plan[wdIndex(d)];
    var eaten = kcalOf(dd), burned = burnOf(dd), goal = +S.settings.kcalGoal || 0;
    var pct = goal ? Math.min(1, eaten / goal) : 0, C = 2 * Math.PI * 50;
    var wGoal = +S.settings.waterGoal || 8, ml = +S.settings.glassMl || 250;
    var h = "";

    // resumen
    h += '<div class="card"><div class="summary">' +
      '<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="12"/>' +
      (goal && eaten ? '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--a)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * pct) + ' ' + C + '"/>' : '') + '</svg>' +
      '<div class="c"><div><b>' + fmt(eaten) + '</b><span>' + (goal ? "de " + fmt(goal) + " kcal" : "kcal") + '</span></div></div></div>' +
      '<div class="stats">' +
      '<div class="stat"><i style="background:var(--a-soft)">🔥</i><div>Comido <b>' + fmt(eaten) + ' kcal</b></div></div>' +
      '<div class="stat"><i style="background:var(--sport-soft)">💪</i><div>Ejercicio <b>' + fmt(burned) + ' kcal</b></div></div>' +
      '<div class="stat"><i style="background:var(--water-soft)">💧</i><div>Agua <b>' + (dd.water * ml / 1000).toLocaleString("es-ES", { maximumFractionDigits: 2 }) + ' L</b> <span class="muted">· ' + dd.water + '/' + wGoal + '</span></div></div>' +
      '</div></div>' + (goal ? "" : '<p class="muted mt">Si quieres, pon un objetivo de calorías en Ajustes ⚙️</p>') + '</div>';

    // deporte
    h += '<div class="card"><h2>Deporte de hoy <span class="tag">' + WD[wdIndex(d)] + '</span></h2>' +
      '<div class="sport-box"><span class="em">' + SPORT_EMOJI(plan.sport) + '</span><div class="grow"><b>' + esc(plan.sport || "Descanso") + '</b><span class="muted">' + (plan.sport ? (dd.sportDone ? "¡Hecho! 🎉" : "Pendiente") : "Planifícalo en Semana") + '</span></div>' +
      (plan.sport ? '<button class="check ' + (dd.sportDone ? "on" : "") + '" id="sportDone" aria-label="Marcar deporte como hecho">' + (dd.sportDone ? "✓" : "") + '</button>' : "") + '</div>';
    (dd.exercises || []).forEach(function (x) {
      h += '<div class="item"><span class="grow">' + esc(x.name) + (x.min ? ' <span class="muted">· ' + x.min + ' min</span>' : "") + '</span><span class="k">' + (x.kcal ? fmt(x.kcal) + " kcal" : "") + '</span><button class="del" data-del-ex="' + x.id + '" aria-label="Borrar">×</button></div>';
    });
    h += '<button class="add-link" id="addEx">+ Apuntar ejercicio</button></div>';

    // comidas
    h += '<div class="card"><h2>Comidas <span class="tag">' + fmt(eaten) + ' kcal</span></h2>';
    MEALS.forEach(function (m) {
      var items = dd.foods.filter(function (f) { return f.meal === m[0]; });
      var sum = items.reduce(function (a, f) { return a + (+f.kcal || 0); }, 0);
      var planned = plan.meals[m[0]];
      h += '<div class="meal"><div class="meal-hd"><b>' + m[2] + ' ' + m[1] + '</b><span>' + (sum ? fmt(sum) + " kcal" : "") + '</span></div>';
      if (planned) h += '<div class="plan-txt">Plan: ' + esc(planned) + '</div>';
      items.forEach(function (f) {
        h += '<div class="item"><span class="grow">' + esc(f.name) + '</span><span class="k">' + (f.kcal ? fmt(f.kcal) + " kcal" : "") + '</span><button class="del" data-del-food="' + f.id + '" aria-label="Borrar">×</button></div>';
      });
      h += '<button class="add-link" data-add-food="' + m[0] + '">+ Añadir</button>';
      if (planned && !items.length) h += ' <button class="add-link" style="color:var(--soft)" data-add-plan="' + m[0] + '">· Usar el plan</button>';
      h += '</div>';
    });
    h += '</div>';

    // agua
    h += '<div class="card"><h2>Agua <span class="tag">' + dd.water + ' de ' + wGoal + ' vasos (' + ml + ' ml)</span></h2><div class="water">';
    for (var i = 0; i < Math.max(wGoal, dd.water); i++) h += '<span class="glass ' + (i < dd.water ? "on" : "") + '"></span>';
    h += '</div><div class="stepper"><button class="btn-water" id="waterMinus" aria-label="Quitar vaso">−</button><button class="btn btn-water grow" id="waterPlus">+ 1 vaso</button></div></div>';

    // peso y nota
    h += '<div class="card"><h2>Peso y notas</h2><div class="row"><div class="field grow" style="margin:0"><label for="wIn">Peso (kg)</label><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="—" value="' + esc(dd.weight) + '"></div></div>' +
      '<div class="field mt" style="margin-bottom:0"><label for="noteIn">Nota del día</label><textarea id="noteIn" placeholder="Cómo te has sentido, qué ajustar…">' + esc(dd.note) + '</textarea></div></div>';

    $("v-hoy").innerHTML = h;

    var sd = $("sportDone"); if (sd) sd.onclick = function () { dd.sportDone = !dd.sportDone; save(); render(); if (dd.sportDone) toast("¡Bien hecho! 💪"); };
    $("addEx").onclick = function () { openExercise(); };
    $("waterPlus").onclick = function () { dd.water++; save(); render(); if (dd.water === wGoal) toast("¡Objetivo de agua cumplido! 💧"); };
    $("waterMinus").onclick = function () { dd.water = Math.max(0, dd.water - 1); save(); render(); };
    $("wIn").onchange = function () { dd.weight = this.value; save(); toast("Peso guardado"); };
    $("noteIn").onchange = function () { dd.note = this.value; save(); };
    document.querySelectorAll("[data-add-food]").forEach(function (b) { b.onclick = function () { openFood(b.getAttribute("data-add-food")); }; });
    document.querySelectorAll("[data-add-plan]").forEach(function (b) { b.onclick = function () { var m = b.getAttribute("data-add-plan"); openFood(m, plan.meals[m]); }; });
    document.querySelectorAll("[data-del-food]").forEach(function (b) { b.onclick = function () { var id = b.getAttribute("data-del-food"); dd.foods = dd.foods.filter(function (f) { return f.id !== id; }); save(); render(); }; });
    document.querySelectorAll("[data-del-ex]").forEach(function (b) { b.onclick = function () { var id = b.getAttribute("data-del-ex"); dd.exercises = dd.exercises.filter(function (f) { return f.id !== id; }); save(); render(); }; });
  }

  function openFood(meal, preset) {
    var memo = Object.keys(S.foodsMemo).sort();
    var h = '<h3>Añadir a ' + MEALS.filter(function (m) { return m[0] === meal; })[0][1].toLowerCase() + '<button class="del" data-close aria-label="Cerrar">×</button></h3>' +
      '<div class="field"><label for="fName">¿Qué has comido?</label><input id="fName" type="text" list="foodList" placeholder="Ej.: tostada con aguacate" value="' + esc(preset || "") + '" autocomplete="off"></div>' +
      '<datalist id="foodList">' + memo.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>' +
      '<div class="field"><label for="fKcal">Calorías (kcal)</label><input id="fKcal" type="number" inputmode="numeric" placeholder="Se calcula sola al escribir"></div><div class="est" id="fEst"></div>' +
      '<div class="field"><label>Comida</label><div class="seg" id="fMeal">' + MEALS.map(function (m) { return '<button type="button" data-m="' + m[0] + '" class="' + (m[0] === meal ? "on" : "") + '">' + m[1] + '</button>'; }).join("") + '</div></div>' +
      '<button class="btn btn-a btn-block" id="fSave">Guardar</button>';
    openSheet(h);
    var sel = meal;
    $("fMeal").querySelectorAll("button").forEach(function (b) { b.onclick = function () { sel = b.getAttribute("data-m"); $("fMeal").querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    var manual = false;
    $("fKcal").oninput = function () { manual = !!this.value; };
    function upd() {
      var v = $("fName").value, box = $("fEst"), k = S.foodsMemo[v];
      if (k) { if (!manual) $("fKcal").value = k; box.innerHTML = "Lo que apuntaste la última vez: <b>" + fmt(k) + " kcal</b>"; return; }
      var e = estimate(v);
      if (!e) { if (!manual) $("fKcal").value = ""; box.innerHTML = v.trim().length > 2 ? "No lo reconozco, pon las kcal a mano (se recordarán para la próxima)." : ""; return; }
      if (!manual) $("fKcal").value = e.total;
      box.innerHTML = "≈ <b>" + fmt(e.total) + " kcal</b> aprox. · " + e.parts.map(function (p) { return (p.q !== 1 ? p.q + "× " : "") + esc(p.name) + " " + p.kcal; }).join(" + ") + "<br>Ración normal. Si fue más o menos, cambia el número.";
    }
    $("fName").oninput = upd;
    if (preset) upd();
    $("fSave").onclick = function () {
      var n = $("fName").value.trim(); if (!n) { $("fName").focus(); return; }
      var k = $("fKcal").value;
      day(cur).foods.push({ id: uid(), name: n, kcal: k ? +k : "", meal: sel });
      if (k) S.foodsMemo[n] = +k; else if (!S.foodsMemo[n]) S.foodsMemo[n] = "";
      save(); closeSheet(); render();
    };
    setTimeout(function () { $("fName").focus(); }, 50);
  }

  function openExercise() {
    var plan = S.plan[wdIndex(parse(cur))];
    var memo = Object.keys(S.exMemo).sort();
    var h = '<h3>Apuntar ejercicio<button class="del" data-close aria-label="Cerrar">×</button></h3>' +
      '<div class="field"><label for="eName">Ejercicio</label><input id="eName" type="text" list="exList" placeholder="Ej.: pesas, correr, pilates" value="' + esc(plan.sport || "") + '" autocomplete="off"></div>' +
      '<datalist id="exList">' + memo.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>' +
      '<div class="row"><div class="field grow"><label for="eMin">Minutos</label><input id="eMin" type="number" inputmode="numeric" placeholder="45"></div>' +
      '<div class="field grow"><label for="eKcal">kcal (opcional)</label><input id="eKcal" type="number" inputmode="numeric" placeholder="300"></div></div>' +
      '<button class="btn btn-a btn-block" id="eSave">Guardar</button>';
    openSheet(h);
    $("eName").oninput = function () { var m = S.exMemo[this.value]; if (m) { $("eMin").value = m.min || ""; $("eKcal").value = m.kcal || ""; } };
    $("eSave").onclick = function () {
      var n = $("eName").value.trim(); if (!n) { $("eName").focus(); return; }
      var x = { id: uid(), name: n, min: +$("eMin").value || "", kcal: +$("eKcal").value || "" };
      var dd = day(cur); dd.exercises.push(x);
      if (plan.sport) dd.sportDone = true;
      S.exMemo[n] = { min: x.min, kcal: x.kcal };
      save(); closeSheet(); render(); toast("Ejercicio apuntado 💪");
    };
  }

  /* ================= SEMANA ================= */
  function renderSemana() {
    var m = monday(cur), h = '<div class="card">';
    for (var i = 0; i < 7; i++) {
      var ds = addDays(m, i), p = S.plan[i], dd = S.days[ds];
      h += '<div class="week-day"><div class="wd-hd ' + (ds === today() ? "today" : "") + '"><b>' + WD[i] + ' ' + parse(ds).getDate() + '</b><button class="add-link" data-edit="' + i + '">Editar</button></div>' +
        '<div class="wd-grid">' +
        '<span>Deporte</span><span>' + (p.sport ? SPORT_EMOJI(p.sport) + " " + esc(p.sport) + (dd && dd.sportDone ? " ✅" : "") : "<em>Descanso</em>") + '</span>';
      MEALS.slice(0, 4).forEach(function (mm) { h += '<span>' + mm[1] + '</span><span>' + (p.meals[mm[0]] ? esc(p.meals[mm[0]]) : "<em>—</em>") + '</span>'; });
      h += '</div></div>';
    }
    h += '</div><div class="card"><h2>Ideas rápidas</h2><p class="muted">El plan de la semana se repite cada semana. Cámbialo cuando quieras con «Editar». En <b>Hoy</b> verás el plan de cada comida y podrás apuntarlo con un toque.</p>' +
      '<button class="btn btn-soft btn-block mt" id="planToShop">🛒 Pasar ingredientes a la compra</button></div>';
    $("v-semana").innerHTML = h;
    document.querySelectorAll("[data-edit]").forEach(function (b) { b.onclick = function () { editDay(+b.getAttribute("data-edit")); }; });
    $("planToShop").onclick = planToShop;
  }

  function editDay(i) {
    var p = S.plan[i];
    var sports = ["Descanso", "Pesas", "Correr", "Pilates", "Yoga", "Spinning", "Natación", "Caminar"];
    var h = '<h3>' + WD[i].charAt(0).toUpperCase() + WD[i].slice(1) + '<button class="del" data-close aria-label="Cerrar">×</button></h3>' +
      '<div class="field"><label for="pSport">Deporte</label><input id="pSport" type="text" value="' + esc(p.sport) + '" placeholder="Ej.: pierna en el gimnasio"></div>' +
      '<div class="seg" style="margin:-4px 0 14px">' + sports.map(function (s) { return '<button type="button" data-sp="' + s + '">' + SPORT_EMOJI(s) + " " + s + '</button>'; }).join("") + '</div>';
    MEALS.slice(0, 4).forEach(function (m) { h += '<div class="field"><label for="pm-' + m[0] + '">' + m[2] + ' ' + m[1] + '</label><input id="pm-' + m[0] + '" type="text" value="' + esc(p.meals[m[0]]) + '" placeholder="Ej.: pollo con verduras"></div>'; });
    h += '<div class="row"><button class="btn btn-ghost grow" id="pCopy">Copiar a…</button><button class="btn btn-a grow" id="pSave">Guardar</button></div>';
    openSheet(h);
    document.querySelectorAll("[data-sp]").forEach(function (b) { b.onclick = function () { var v = b.getAttribute("data-sp"); $("pSport").value = v === "Descanso" ? "" : v; }; });
    function collect() { p.sport = $("pSport").value.trim(); MEALS.slice(0, 4).forEach(function (m) { p.meals[m[0]] = $("pm-" + m[0]).value.trim(); }); }
    $("pSave").onclick = function () { collect(); save(); closeSheet(); render(); toast("Plan guardado"); };
    $("pCopy").onclick = function () {
      collect(); save();
      var h2 = '<h3>Copiar ' + WD[i] + ' a…<button class="del" data-close aria-label="Cerrar">×</button></h3><div class="seg" id="cpDays">' +
        WD.map(function (w, j) { return j === i ? "" : '<button type="button" data-j="' + j + '">' + w + '</button>'; }).join("") + '</div>' +
        '<p class="muted mt">Se copiarán el deporte y las comidas.</p><button class="btn btn-a btn-block mt" id="cpGo">Copiar</button>';
      openSheet(h2);
      $("cpDays").querySelectorAll("button").forEach(function (b) { b.onclick = function () { b.classList.toggle("on"); }; });
      $("cpGo").onclick = function () {
        var n = 0; $("cpDays").querySelectorAll("button.on").forEach(function (b) { var j = +b.getAttribute("data-j"); S.plan[j] = JSON.parse(JSON.stringify(p)); n++; });
        save(); closeSheet(); render(); toast(n ? "Copiado a " + n + " día" + (n > 1 ? "s" : "") : "No has elegido ningún día");
      };
    };
  }

  function planToShop() {
    var words = [];
    for (var i = 0; i < 7; i++) MEALS.slice(0, 4).forEach(function (m) {
      (S.plan[i].meals[m[0]] || "").split(/,| y | con | e |\+|\//i).forEach(function (w) { w = w.trim(); if (w.length > 2) words.push(w.charAt(0).toUpperCase() + w.slice(1)); });
    });
    var uniq = []; words.forEach(function (w) { if (uniq.map(function (x) { return x.toLowerCase(); }).indexOf(w.toLowerCase()) < 0) uniq.push(w); });
    if (!uniq.length) { toast("Primero apunta comidas en la semana"); return; }
    var have = S.shopping.map(function (x) { return x.name.toLowerCase(); });
    var h = '<h3>Pasar a la compra<button class="del" data-close aria-label="Cerrar">×</button></h3><p class="muted" style="margin-bottom:10px">Elige lo que te falta:</p><div id="ptsList">' +
      uniq.map(function (w, k) { var already = have.indexOf(w.toLowerCase()) >= 0; return '<label class="shop-item"><input type="checkbox" data-w="' + esc(w) + '" ' + (already ? "disabled" : "checked") + ' style="width:22px;height:22px"><span class="nm">' + esc(w) + (already ? ' <span class="muted">(ya en la lista)</span>' : "") + '</span></label>'; }).join("") +
      '</div><button class="btn btn-a btn-block mt" id="ptsGo">Añadir a la compra</button>';
    openSheet(h);
    $("ptsGo").onclick = function () {
      var n = 0; $("ptsList").querySelectorAll("input:checked").forEach(function (c) { S.shopping.push({ id: uid(), name: c.getAttribute("data-w"), cat: catOf(c.getAttribute("data-w")), qty: "", done: false }); n++; });
      save(); closeSheet(); render(); toast(n + " añadido" + (n === 1 ? "" : "s") + " a la compra 🛒");
    };
  }

  /* ================= COMPRA ================= */
  function renderCompra() {
    var left = S.shopping.filter(function (i) { return !i.done; }), done = S.shopping.filter(function (i) { return i.done; });
    var h = '<div class="card"><div class="row"><input id="sName" type="text" class="grow" placeholder="Añadir producto…" autocomplete="off" enterkeyhint="done">' +
      '<button class="btn btn-a" id="sAdd" aria-label="Añadir">+</button></div>' +
      '<div class="row mt"><select id="sCat" class="grow">' + CATS.map(function (c) { return '<option>' + c + '</option>'; }).join("") + '</select><input id="sQty" type="text" placeholder="Cantidad" style="width:110px"></div></div>';
    h += '<div class="card"><h2>Falta por comprar <span class="tag">' + left.length + '</span></h2>';
    if (!left.length) h += '<div class="empty">¡Lo tienes todo! 🎉</div>';
    CATS.forEach(function (c) {
      var its = left.filter(function (i) { return (i.cat || "Otros") === c; });
      if (!its.length) return;
      h += '<div class="cat-title">' + c + '</div>';
      its.forEach(function (i) { h += shopRow(i); });
    });
    h += '</div>';
    if (done.length) {
      h += '<div class="card"><h2>Comprado <span class="tag">' + done.length + '</span></h2>';
      done.forEach(function (i) { h += shopRow(i); });
      h += '<button class="btn btn-ghost btn-block mt" id="sClear">Vaciar comprados</button></div>';
    }
    $("v-compra").innerHTML = h;
    function add() {
      var n = $("sName").value.trim(); if (!n) return;
      S.shopping.push({ id: uid(), name: n, cat: $("sCat").value, qty: $("sQty").value.trim(), done: false });
      save(); var c = $("sCat").value; render(); $("sCat").value = c; $("sName").focus();
    }
    $("sAdd").onclick = add;
    $("sName").onkeydown = function (e) { if (e.key === "Enter") add(); };
    $("sName").oninput = function () { var c = catOf(this.value); if (c !== "Otros") $("sCat").value = c; };
    document.querySelectorAll("[data-shop]").forEach(function (b) { b.onclick = function () { var i = S.shopping.filter(function (x) { return x.id === b.getAttribute("data-shop"); })[0]; i.done = !i.done; save(); render(); }; });
    document.querySelectorAll("[data-del-shop]").forEach(function (b) { b.onclick = function () { var id = b.getAttribute("data-del-shop"); S.shopping = S.shopping.filter(function (x) { return x.id !== id; }); save(); render(); }; });
    var cl = $("sClear"); if (cl) cl.onclick = function () { S.shopping = S.shopping.filter(function (x) { return !x.done; }); save(); render(); };
  }
  function shopRow(i) {
    return '<div class="shop-item ' + (i.done ? "done" : "") + '"><button class="check ' + (i.done ? "on" : "") + '" data-shop="' + i.id + '" aria-label="Marcar ' + esc(i.name) + '">' + (i.done ? "✓" : "") + '</button>' +
      '<span class="nm">' + esc(i.name) + (i.qty ? ' <span class="muted">· ' + esc(i.qty) + '</span>' : "") + '</span><button class="del" data-del-shop="' + i.id + '" aria-label="Borrar">×</button></div>';
  }

  /* ================= PROGRESO ================= */
  function renderProgreso() {
    var t = today(), last7 = [], h = "";
    for (var i = 6; i >= 0; i--) last7.push(addDays(t, -i));
    var kc = last7.map(function (s) { return S.days[s] ? kcalOf(S.days[s]) : 0; });
    var wt = last7.map(function (s) { return S.days[s] ? S.days[s].water : 0; });
    var sportDays = last7.filter(function (s) { var d = S.days[s]; return d && (d.sportDone || (d.exercises && d.exercises.length)); }).length;
    var logged = kc.filter(function (x) { return x > 0; });
    var avgK = logged.length ? logged.reduce(function (a, b) { return a + b; }, 0) / logged.length : 0;
    var avgW = wt.reduce(function (a, b) { return a + b; }, 0) / 7;

    h += '<div class="card"><h2>Últimos 7 días</h2><div class="kpis">' +
      '<div class="kpi"><b>' + (avgK ? fmt(avgK) : "—") + '</b><span>kcal/día</span></div>' +
      '<div class="kpi"><b>' + sportDays + '/7</b><span>días de deporte</span></div>' +
      '<div class="kpi"><b>' + avgW.toLocaleString("es-ES", { maximumFractionDigits: 1 }) + '</b><span>vasos/día</span></div></div></div>';

    // barras de calorías
    var goal = +S.settings.kcalGoal || 0, mx = Math.max.apply(null, kc.concat([goal, 1])) * 1.1, W = 320, H = 150, bw = 30;
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 22) + '" role="img" aria-label="Calorías de los últimos 7 días">';
    if (goal) { var gy = H - goal / mx * H; svg += '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="' + W + '" y="' + (gy - 4) + '" text-anchor="end" font-size="10" fill="var(--ok)" font-weight="700">objetivo</text>'; }
    kc.forEach(function (v, k) {
      var x = 10 + k * ((W - 20) / 7) + ((W - 20) / 7 - bw) / 2, bh = v / mx * H;
      svg += '<rect x="' + x + '" y="' + (H - bh) + '" width="' + bw + '" height="' + Math.max(bh, 2) + '" rx="6" fill="' + (last7[k] === t ? "var(--a)" : "var(--a-soft)") + '"/>' +
        '<text x="' + (x + bw / 2) + '" y="' + (H + 15) + '" text-anchor="middle" font-size="11" fill="var(--soft)" font-weight="700">' + WD[wdIndex(parse(last7[k]))].slice(0, 1).toUpperCase() + '</text>' +
        (v ? '<text x="' + (x + bw / 2) + '" y="' + (H - bh - 4) + '" text-anchor="middle" font-size="9" fill="var(--soft)">' + fmt(v) + '</text>' : "");
    });
    svg += '</svg>';
    h += '<div class="card"><h2>Calorías <span class="tag">kcal por día</span></h2>' + svg + '</div>';

    // peso
    var ws = Object.keys(S.days).filter(function (s) { return S.days[s].weight; }).sort().slice(-30).map(function (s) { return [s, +S.days[s].weight]; });
    h += '<div class="card"><h2>Peso <span class="tag">' + (ws.length ? ws[ws.length - 1][1].toLocaleString("es-ES") + " kg" : "") + '</span></h2>';
    if (ws.length < 2) h += '<div class="empty">Apunta tu peso en «Hoy» al menos dos días para ver la evolución.</div>';
    else {
      var vals = ws.map(function (x) { return x[1]; }), lo = Math.min.apply(null, vals) - 1, hi = Math.max.apply(null, vals) + 1, WW = 320, HH = 140;
      var pts = ws.map(function (x, k) { return [10 + k * (WW - 20) / (ws.length - 1), HH - (x[1] - lo) / (hi - lo) * HH]; });
      var diff = vals[vals.length - 1] - vals[0];
      var s2 = '<svg class="chart" viewBox="0 0 ' + WW + ' ' + (HH + 22) + '" role="img" aria-label="Evolución del peso"><polyline fill="none" stroke="var(--sport)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(function (p) { return p.join(","); }).join(" ") + '"/>' +
        pts.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="var(--sport)"/>'; }).join("") +
        '<text x="10" y="' + (HH + 16) + '" font-size="10" fill="var(--soft)">' + nice(ws[0][0], { day: "numeric", month: "short" }) + '</text><text x="' + (WW - 10) + '" y="' + (HH + 16) + '" text-anchor="end" font-size="10" fill="var(--soft)">' + nice(ws[ws.length - 1][0], { day: "numeric", month: "short" }) + '</text></svg>';
      h += s2 + '<p class="muted mt">Cambio desde ' + nice(ws[0][0], { day: "numeric", month: "short" }) + ': <b>' + (diff > 0 ? "+" : "") + diff.toLocaleString("es-ES", { maximumFractionDigits: 1 }) + ' kg</b></p>';
    }
    h += '</div>';
    $("v-progreso").innerHTML = h;
  }

  /* ================= AJUSTES ================= */
  function openSettings() {
    var st = S.settings;
    var h = '<h3>Ajustes<button class="del" data-close aria-label="Cerrar">×</button></h3>' +
      '<div class="field"><label for="gK">Objetivo de calorías al día (opcional)</label><input id="gK" type="number" inputmode="numeric" placeholder="Sin objetivo" value="' + esc(st.kcalGoal) + '"></div>' +
      '<div class="row"><div class="field grow"><label for="gW">Vasos de agua al día</label><input id="gW" type="number" inputmode="numeric" value="' + esc(st.waterGoal) + '"></div>' +
      '<div class="field grow"><label for="gM">ml por vaso</label><input id="gM" type="number" inputmode="numeric" value="' + esc(st.glassMl) + '"></div></div>' +
      '<div class="field"><label>Tema</label><div class="seg" id="gT">' + [["auto", "Automático"], ["light", "Claro"], ["dark", "Oscuro"]].map(function (x) { return '<button type="button" data-t="' + x[0] + '" class="' + (st.theme === x[0] ? "on" : "") + '">' + x[1] + '</button>'; }).join("") + '</div></div>' +
      '<button class="btn btn-a btn-block" id="gSave">Guardar</button>' +
      '<div class="card" style="margin-top:18px"><h2>Copia de seguridad</h2><p class="muted">Tus datos solo están en este móvil. Descarga una copia de vez en cuando por si cambias de móvil o borras el navegador.</p>' +
      '<div class="row mt"><button class="btn btn-soft grow" id="bExp">Descargar copia</button><label class="btn btn-ghost grow" for="bImp" style="cursor:pointer">Restaurar</label><input id="bImp" type="file" accept="application/json" hidden></div></div>' +
      '<button class="btn btn-ghost btn-block mt" id="bReset" style="color:var(--a-ink)">Borrar todos los datos</button>';
    openSheet(h);
    var theme = st.theme;
    $("gT").querySelectorAll("button").forEach(function (b) { b.onclick = function () { theme = b.getAttribute("data-t"); $("gT").querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); }); }; });
    $("gSave").onclick = function () {
      st.kcalGoal = $("gK").value; st.waterGoal = Math.max(1, +$("gW").value || 8); st.glassMl = Math.max(50, +$("gM").value || 250); st.theme = theme;
      if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
      save(); closeSheet(); render(); toast("Ajustes guardados");
    };
    $("bExp").onclick = function () {
      var blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "mi-plan-copia-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
    };
    $("bImp").onchange = function () {
      var f = this.files[0]; if (!f) return; var r = new FileReader();
      r.onload = function () { try { var d = JSON.parse(r.result); if (!d.days || !d.plan) throw 0; S = d; save(); closeSheet(); render(); toast("Copia restaurada ✅"); } catch (e) { toast("Ese archivo no es una copia válida"); } };
      r.readAsText(f);
    };
    $("bReset").onclick = function () { if (confirm("¿Seguro que quieres borrar todos tus datos? No se puede deshacer.")) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
  }

  /* ================= hoja inferior y avisos ================= */
  function openSheet(h) { $("sheet").innerHTML = h; $("sheetBg").hidden = false; $("sheet").querySelectorAll("[data-close]").forEach(function (b) { b.onclick = closeSheet; }); }
  function closeSheet() { $("sheetBg").hidden = true; $("sheet").innerHTML = ""; }
  $("sheetBg").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  var tt; function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("show"); }, 1800); }

  /* al volver a la app otro día, que salga el día actual */
  var lastSeen = today();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && today() !== lastSeen) { lastSeen = today(); cur = today(); render(); } });

  render();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
